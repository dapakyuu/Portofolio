# Aturan cache per jenis file.
# (Pakai map supaya semua add_header cukup ditulis sekali di level server;
#  add_header di dalam location akan menghapus header dari level server.)
map $uri $cache_control {
    ~^/static/        "public, max-age=31536000, immutable"; # hasil build Vite (nama file ber-hash)
    ~^/assets/        "public, max-age=604800";              # gambar & model 3D (7 hari)
    default           "no-cache, must-revalidate";           # index.html dll. selalu dicek ulang
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompresi agar halaman lebih cepat dimuat
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint health check untuk Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Model 3D roket (.glb tidak ada di mime.types bawaan nginx)
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
