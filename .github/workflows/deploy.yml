name: Build & Deploy ke VPS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: read

# Jangan jalankan dua deploy bersamaan
concurrency:
  group: portofolio-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & uji image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t daffa-portofolio:ci .

      - name: Jalankan container & cek halaman
        run: |
          docker run -d --name porto -p 8080:80 daffa-portofolio:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://localhost:8080/assets/daffa.jpg
          echo "Container OK"

      - name: Tampilkan log jika gagal
        if: failure()
        run: docker logs porto || true

  deploy:
    name: Deploy ke VPS Hostinger
    needs: build
    # Hanya deploy saat push ke master atau dijalankan manual (bukan saat pull request)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cek API key & VM ID sudah diisi
        id: check
        env:
          API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          VM_ID: ${{ vars.HOSTINGER_VM_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$VM_ID" ]; then
            echo "::warning::Secret HOSTINGER_API_KEY atau variable HOSTINGER_VM_ID belum diisi. Deploy dilewati. Lihat docs/DEPLOY.md langkah 3."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy lewat Hostinger API (Docker Manager)
        if: steps.check.outputs.ready == 'true'
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: portofolio
          docker-compose-path: docker-compose.yml
          environment-variables: |
            DEPLOY_COMMIT=${{ github.sha }}
